<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>360° Product Viewer</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
  }

  #stage {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    touch-action: none;
  }

  #viewer-container {
    height: 100dvh;
    width: calc(100dvh * 9 / 16);
    max-width: 100vw;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    transition: transform 0.15s ease-out;
  }
  #viewer-container:active {
    cursor: grabbing;
  }

  /* Standard HTML img tag for crisp, native GPU scaling */
  #viewer-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .hint {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    pointer-events: none;
  }

  #fullscreenBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.5);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    z-index: 10;
  }
  #fullscreenBtn:hover {
    background: rgba(0,0,0,0.7);
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="viewer-container">
      <img id="viewer-img" alt="360 Product View">
    </div>
  </div>

  <p class="hint">Drag to spin &nbsp;•&nbsp; Scroll or pinch to zoom &nbsp;•&nbsp; Double-click to reset zoom</p>
  <button id="fullscreenBtn">Fullscreen</button>

  <script>
    const TOTAL_FRAMES = 40;
    const START_FRAME = 37; // Starts at frame_0037
    const DRAG_SENSITIVITY = 15; // Pixels dragged per frame change (lower = faster spin)
    
    // 1. Preload images into memory so spinning is instantaneous
    const loadedImages = [];
    for (let i = 1; i <= TOTAL_FRAMES; i++) {
      const num = String(i).padStart(4, '0');
      const img = new Image();
      img.src = 'images/frame_' + num + '.jpg';
      loadedImages.push(img);
    }

    const viewerImg = document.getElementById('viewer-img');
    let currentFrame = START_FRAME - 1; // 0-indexed

    function updateImage() {
      viewerImg.src = loadedImages[currentFrame].src;
    }
    updateImage();

    // 2. Drag to spin (Reversed direction)
    let isDragging = false;
    let startX = 0;
    let dragDistance = 0;

    const stageEl = document.getElementById('stage');

    function onPointerDown(e) {
      isDragging = true;
      startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      dragDistance = 0;
      stopAutoSpin();
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const dx = x - startX;
      
      // Reverse direction: dragging right moves backwards through frames
      if (Math.abs(dx) > DRAG_SENSITIVITY) {
        const frameShift = Math.floor(dx / DRAG_SENSITIVITY);
        currentFrame = (currentFrame - frameShift + TOTAL_FRAMES) % TOTAL_FRAMES;
        startX = x;
        updateImage();
      }
    }

    function onPointerUp() {
      isDragging = false;
    }

    stageEl.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    stageEl.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // 3. Auto-spin feature (starts automatically, stops on drag)
    const ENABLE_AUTO_SPIN = true;
    const AUTO_SPIN_SPEED = 120; // milliseconds per frame
    let autoSpinInterval = null;

    function startAutoSpin() {
      if (!ENABLE_AUTO_SPIN || autoSpinInterval) return;
      autoSpinInterval = setInterval(() => {
        // Step forward / spin automatically
        currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
        updateImage();
      }, AUTO_SPIN_SPEED);
    }

    function stopAutoSpin() {
      if (autoSpinInterval) {
        clearInterval(autoSpinInterval);
        autoSpinInterval = null;
      }
    }

    startAutoSpin();

    // 4. Zoom system (Scroll & Pinch)
    const containerEl = document.getElementById('viewer-container');
    let scale = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;

    function applyZoom() {
      containerEl.style.transform = 'scale(' + scale + ')';
    }

    stageEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale));
      applyZoom();
    }, { passive: false });

    let pinchStartDistance = null;
    let pinchStartScale = 1;

    function getPinchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    stageEl.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 2) {
        pinchStartDistance = getPinchDistance(e.touches);
        pinchStartScale = scale;
      }
    }, { passive: true });

    stageEl.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length === 2 && pinchStartDistance) {
        e.preventDefault();
        const newDistance = getPinchDistance(e.touches);
        scale = pinchStartScale * (newDistance / pinchStartDistance);
        scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale));
        applyZoom();
      }
    }, { passive: false });

    stageEl.addEventListener('touchend', (e) => {
      if (!e.touches || e.touches.length < 2) pinchStartDistance = null;
    });

    containerEl.addEventListener('dblclick', () => {
      scale = 1;
      applyZoom();
    });

    // Fullscreen logic
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    });

    if (!document.documentElement.requestFullscreen) {
      fullscreenBtn.style.display = 'none';
    }
  </script>

</body>
</html>
