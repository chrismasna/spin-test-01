<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover + fixed scale prevents Safari from autoscaling -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>360° Product Viewer</title>

<!-- ease360's stylesheet -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ddintzner/ease360@main/ease360.css">

<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
  }

  #stage {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    touch-action: none;
  }

  #viewer {
    height: 100dvh;
    width: calc(100dvh * 9 / 16);
    max-width: 100vw;
    cursor: grab;
    transform-origin: center center;
    transition: transform 0.15s ease-out;
  }

  /* FORCE SAFARI CANVAS TO USE CRISP/NEAREST FILTERING */
  #viewer canvas {
    width: 100% !important;
    height: 100% !important;
    image-rendering: -webkit-optimize-contrast !important;
    image-rendering: crisp-edges !important;
    image-rendering: pixelated !important;
  }

  #viewer:active {
    cursor: grabbing;
  }

  .hint {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    pointer-events: none;
  }

  #fullscreenBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.5);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #fullscreenBtn:hover {
    background: rgba(0,0,0,0.7);
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="viewer"></div>
  </div>

  <p class="hint">Drag to spin &nbsp;•&nbsp; Scroll or pinch to zoom &nbsp;•&nbsp; Double-click to reset zoom</p>
  <button id="fullscreenBtn">Fullscreen</button>

  <!-- ease360's script -->
  <script src="https://cdn.jsdelivr.net/gh/ddintzner/ease360@main/ease360-1.0.0.min.js"></script>

  <script>
    const frames = [];
    for (let i = 1; i <= 40; i++) {
      const num = String(i).padStart(4, '0');
      frames.push('images/frame_' + num + '.jpg');
    }

    const START_FRAME_INDEX = 37;
    const startAngleDegree = Math.round((START_FRAME_INDEX / 40) * 360);

    // Get exact Retina multiplier (e.g. 3x on iPhone 13 Mini)
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    const viewer = ease360('#viewer', {
      frames: frames,
      // Multiply dimensions by DPR so canvas allocates enough pixels for Retina screens
      sourceWidth: 1080 * dpr,
      sourceHeight: 1920 * dpr,
      damping: 0.92,
      frameDirection: -1,
      startAngle: startAngleDegree
    });

    // Post-init fix: force 2D context image smoothing OFF on iOS
    setTimeout(() => {
      const canvas = document.querySelector('#viewer canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.imageSmoothingEnabled = false;
          ctx.webkitImageSmoothingEnabled = false;
        }
      }
    }, 100);

    // ===========================================================
    // AUTO-SPIN FEATURE
    // ===========================================================
    const ENABLE_AUTO_SPIN = true;
    const AUTO_SPIN_SPEED = 1.0;

    if (ENABLE_AUTO_SPIN) {
      viewer.spinOver(AUTO_SPIN_SPEED);

      const stopAutoSpin = () => viewer.spinOut();
      const stageEl = document.getElementById('stage');
      stageEl.addEventListener('pointerdown', stopAutoSpin, { once: true });
      stageEl.addEventListener('touchstart', stopAutoSpin, { once: true });
    }

    // ===========================================================
    // ZOOM
    // ===========================================================
    const viewerEl = document.getElementById('viewer');
    const stageEl = document.getElementById('stage');
    let scale = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;

    function applyZoom() {
      viewerEl.style.transform = 'scale(' + scale + ')';
    }

    stageEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale));
      applyZoom();
    }, { passive: false });

    let pinchStartDistance = null;
    let pinchStartScale = 1;

    function getPinchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    stageEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        pinchStartDistance = getPinchDistance(e.touches);
        pinchStartScale = scale;
      }
    }, { passive: true });

    stageEl.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinchStartDistance) {
        e.preventDefault();
        const newDistance = getPinchDistance(e.touches);
        scale = pinchStartScale * (newDistance / pinchStartDistance);
        scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale));
        applyZoom();
      }
    }, { passive: false });

    stageEl.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) pinchStartDistance = null;
    });

    viewerEl.addEventListener('dblclick', () => {
      scale = 1;
      applyZoom();
    });

    // ===========================================================
    // FULLSCREEN BUTTON
    // ===========================================================
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    });

    if (!document.documentElement.requestFullscreen) {
      fullscreenBtn.style.display = 'none';
    }
  </script>

</body>
</html>
